# Render blueprint — deploys the chat server + a free Postgres instance.
# In Render: New → Blueprint → point at this repo. Set CLIENT_ORIGIN to your
# deployed client URL after the client is live.
services:
  - type: web
    name: realtime-chat-server
    runtime: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false # set to your Vercel client URL
      - key: DATABASE_URL
        fromDatabase:
          name: realtime-chat-db
          property: connectionString

databases:
  - name: realtime-chat-db
    plan: free
